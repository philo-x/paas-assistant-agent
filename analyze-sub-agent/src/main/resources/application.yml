server:
  port: 10007

agentscope:
  model:
    provider: ${MODEL_PROVIDER:dashscope}
  dashscope:
    api-key: ${MODEL_API_KEY:-}
    model-name: ${MODEL_NAME:qwen-max}
    base-url: ${DASHSCOPE_BASE_URL:-}
  openai:
    api-key: ${MODEL_API_KEY:-}
    model-name: ${MODEL_NAME:gpt-5}
    base-url: ${OPENAI_BASE_URL:${MODEL_BASE_URL:-}}
  a2a:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:public}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
    server:
      require-inner-message: true
      card:
        name: analyze_agent
        description: PaaS 平台 K8s 快速诊断助手
        provider:
          name: PaaS Platform Agent Assistant
          organization: PaaS Platform Team
          url: https://paas.example.com
          contact:
            email: support@paas.example.com
            phone: 400-100-2000
  mem0:
    api-key: ${MEM0_API_KEY:-}
    base-url: ${MEM0_BASE_URL:https://api.mem0.ai}
    api-type: ${MEM0_API_TYPE:auto}
    infer-enabled: ${MEM0_INFER_ENABLED:false}
  mcp:
    k8sgpt-mcp-url: ${K8SGPT_MCP_URL:http://localhost:8089/mcp}
    k8s-mcp-url: ${K8S_MCP_URL:http://localhost:9096/mcp}
    tool-timeout: ${MCP_TOOL_TIMEOUT:PT3M}

spring:
  application:
    name: analyze-sub-agent
  main:
    web-application-type: reactive

agent:
  prompts:
    analyze-agent-instruction: |
      角色与职责:
      你是一个 Kubernetes 快速诊断助手，专注于 Kubernetes 日常资源查询与快速异常诊断。

      可用能力:
      - K8s 动态资源查询工具：你可以直接调用 list, get, describe 等动态资源管理工具来查询集群内的任意资源详情。
      - k8s 资源问题分析工具：你可以调用 analyze 等工具来快速扫描集群异常。

      工作原则:
      - 当识别到用户只是要求获取某资源的详情或列表时，直接使用动态查询工具返回结构化数据，无需调用 analyze 进行异常扫描。
      - 收到异常扫描诊断请求后，调用 analyze 工具扫描集群异常，设置 explain=false 以确保快速返回。
      - 如果需要限定命名空间，请从用户的请求中提取 namespace 参数，否则分析整个集群。
      - 基于 analyze 返回的原始异常数据，用简洁中文解释每个问题。
      - 给出优先级排序和修复建议。
      - 本 Agent 支持多步迭代，但依然需保持响应迅捷。

      输出要求:
      - 输出简洁明了，不需要完整的证据链。
      - 如果问题复杂度超出快速诊断范围（例如需要深入查看日志或复杂的网络排查），在结论最后建议用户切换到“深度诊断模式”（diagnosis_agent）。
      - 使用 GitHub Flavored Markdown 输出表格、列表和代码块。
