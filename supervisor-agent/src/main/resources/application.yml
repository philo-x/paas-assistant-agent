server:
  port: 10008

agentscope:
  model:
    provider: ${MODEL_PROVIDER:openai}
  dashscope:
    api-key: ${MODEL_API_KEY:-}
    model-name: ${MODEL_NAME:qwen-max}
    base-url: ${DASHSCOPE_BASE_URL:-}
  openai:
    api-key: ${MODEL_API_KEY:-}
    model-name: ${MODEL_NAME:gpt-5}
    base-url: ${OPENAI_BASE_URL:${MODEL_BASE_URL:-}}
  a2a:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:public}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}

spring:
  config:
    import: "optional:classpath:tool-narrations.yml"
  application:
    name: supervisor-agent
  main:
    web-application-type: reactive
  web:
    resources:
      static-locations: ${SPRING_WEB_RESOURCES_STATIC_LOCATIONS:classpath:/static/}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:paas_agent_assistant}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useAffectedRows=true
    username: ${DB_USERNAME:paas_agent_assistant}
    password: ${DB_PASSWORD:paas_agent_assistant@321}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origin-patterns: "*"
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS
        allowed-headers: "*"
        allow-credentials: true
        max-age: 3600
  endpoint:
    health:
      show-details: when-authorized

agent:
  a2a:
    child-agent-timeout: ${A2A_CHILD_AGENT_TIMEOUT:PT40M}
    child-agent-idle-timeout: ${A2A_CHILD_AGENT_IDLE_TIMEOUT:PT1M}
    child-agent-inter-event-timeout: ${A2A_CHILD_AGENT_INTER_EVENT_TIMEOUT:PT5M}
    child-agent-retry-attempts: ${A2A_CHILD_AGENT_RETRY_ATTEMPTS:3}
    child-agent-retry-backoff: ${A2A_CHILD_AGENT_RETRY_BACKOFF:PT1S}
  supervisor:
    tool-timeout: ${SUPERVISOR_TOOL_TIMEOUT:PT42M}
  prompts:
    supervisor-agent-instruction: |
      角色与职责:
      你是 PaaS 平台 Agent 助手的调度层 Supervisor。
      你不直接处理 Kubernetes 业务，而是把请求路由给最合适的子 Agent。

      你可以调用三个子 Agent:
      - analyze_agent: 负责快速扫描集群状态、日常基础资源查询（List/Get/Describe）以及异常概览。响应快，能处理绝大多数即时查询。
      - diagnosis_agent: 专注深度的异常分析、多链路排查与疑难杂症的根因定位。基础查询请勿路由至此，仅当需要多步溯源时使用。
      - guide_agent: 负责 YAML 字段解释、describe 解读、命令推荐和资源使用指南。不负责具体集群故障的诊断。

      路由规则:
      - 出现查询某个资源的详情/列表（如：查一下 namespace 列表、看看那个 pod 的详情）、快速诊断、概要扫描、状态速览等语义时，调用 analyze_agent
      - 出现深度诊断、故障排查、复杂异常排查等明确需要多步链路探查的语义时，或者需要执行重启、扩缩容、修复等变更前需要评估时，路由给 diagnosis_agent
      - 出现“这个字段是什么意思”“这个 describe 怎么看”“给我命令”“这个 YAML 怎么写”等解释与指南语义时，调用 guide_agent

      约束:
      - 每轮路由必须以最新的“本轮用户问题”为准，历史对话、历史诊断结论、历史工具调用结果只能作为参考，不能替换或改写本轮问题
      - 如果历史内容与本轮用户问题不一致，忽略历史任务，按本轮用户问题重新判断路由
      - 你只负责协调和路由，不直接给出未经核实的诊断结论
      - 如果请求同时包含诊断和解释，以诊断优先，再让 diagnosis_agent 决定是否需要补充说明

      Markdown 格式要求:
      - 使用 GitHub Flavored Markdown 输出表格、列表和代码块，确保前端可直接渲染
      - 表格必须包含表头行、分隔行和数据行，且每一行列数必须完全一致
      - 如果表格首列是序号，表头必须显式写“序号”，不要省略空表头
      - 禁止输出单独一行的竖线“|”，禁止输出半截表格或列数不一致的表格
      - 不确定是否能组成合法表格时，优先使用普通项目符号列表

logging:
  level:
    io.agentscope.core.a2a: ${A2A_LOG_LEVEL:INFO}
    io.agentscope.core.nacos: ${A2A_LOG_LEVEL:INFO}
