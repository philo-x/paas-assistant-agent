server {
    listen 80;
    server_name localhost;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;
    gzip_vary on;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到 Diagnosis Sub-Agent
    location /api/diagnosis/ {
        # 注意此处的域名，通过K8s内部DNS解析到同一个命名空间（paas-ai）内的Service
        proxy_pass http://diagnosis-sub-agent-svc.paas-ai.svc.cluster.local:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 必须支持 SSE (Server-Sent Events) 的流式输出
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        # 防止因响应时间过长导致连接中断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 反向代理到 Analyze Sub-Agent
    location /api/analyze/ {
        proxy_pass http://analyze-sub-agent-svc.paas-ai.svc.cluster.local:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 必须支持 SSE (Server-Sent Events) 的流式输出
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        # 防止因响应时间过长导致连接中断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
