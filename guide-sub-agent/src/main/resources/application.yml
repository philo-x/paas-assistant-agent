server:
  port: 10005

agentscope:
  model:
    provider: ${MODEL_PROVIDER:dashscope}
  dashscope:
    api-key: ${MODEL_API_KEY:-}
    model-name: ${MODEL_NAME:qwen-max}
    base-url: ${DASHSCOPE_BASE_URL:-}
    # dashscope RAG
    access-key-id: ${DASHSCOPE_ACCESS_KEY_ID:-}
    access-key-secret: ${DASHSCOPE_ACCESS_KEY_SECRET:-}
    workspace-id: ${DASHSCOPE_WORKSPACE_ID:-}
    index-id: ${DASHSCOPE_INDEX_ID:3i861vcc36}
  openai:
    api-key: ${MODEL_API_KEY:-}
    model-name: ${MODEL_NAME:gpt-5}
    base-url: ${OPENAI_BASE_URL:${MODEL_BASE_URL:-}}
    thinking: ${MODEL_THINKING:false}
    reasoning-effort: ${MODEL_REASONING_EFFORT:}
  mem0:
    api-key: ${MEM0_API_KEY:-}
    base-url: ${MEM0_BASE_URL:https://api.mem0.ai}
    api-type: ${MEM0_API_TYPE:auto}
    infer-enabled: ${MEM0_INFER_ENABLED:false}
  a2a:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:public}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
    server:
      require-inner-message: true
      card:
        name: guide_agent
        description: PaaS 平台 K8s 指南与解释助手
        provider:
          name: PaaS Platform Agent Assistant
          organization: PaaS Platform Team
          url: https://paas.example.com
          contact:
            email: support@paas.example.com
            phone: 400-100-2000
  memory:
    auto-context:
      max-token: "${AUTO_CONTEXT_MAX_TOKEN:225280}"
      token-ratio: "${AUTO_CONTEXT_TOKEN_RATIO:0.75}"
      msg-threshold: "${AUTO_CONTEXT_MSG_THRESHOLD:300}"
      last-keep: "${AUTO_CONTEXT_LAST_KEEP:5}"

spring:
  application:
    name: guide-sub-agent
  main:
    web-application-type: reactive
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:paas_agent_assistant}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useAffectedRows=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

agent:
  prompts:
    agent-instruction: |
      角色与职责:
      你是 PaaS 平台的 Kubernetes 指南与通用运维助手。
      你不仅负责解释 YAML 字段、解读 describe 输出、推荐排障命令，还能通过挂载的 MCP 工具执行底层的通用远程运维操作（例如通过 SSH 登录虚拟机清理 Docker 磁盘空间等）。
      对于复杂的 K8s 诊断、故障自愈、资源修改（扩缩容等）操作，明确建议用户切换到 diagnosis_agent 处理。

      可用能力:
      - RAG 知识检索: 用于引用 Kubernetes 官方文档和平台运行手册
      - 本地只读辅助工具: guide-translate-yaml-field, guide-interpret-describe, guide-recommend-command
      - 远程执行能力 (MCP 工具): 从 Nacos 动态发现并挂载的 change-mcp-server 运维执行工具（例如 docker-system-prune-vm 等），支持根据用户请求直接执行底层运维任务。

      工作原则:
      - 对于概念解释与配置文件解读，保持输出的细致与高度结构化。
      - 当接收到明确匹配你现有 MCP 工具能力的执行指令（如清理闲置镜像/磁盘空间）时，果断调用对应工具完成物理执行，并将执行结果反馈给用户。
      - 对超出当前能力边界的深层排障与高级变更，不要强行操作，引导至 diagnosis_agent。

      输出要求:
      - 回答要有结构，讲清“字段含义 / 默认行为 / 常见风险 / 推荐排查命令”或“操作步骤 / 执行结果”
      - 引用知识库内容时要说明依据来自官方文档或平台手册
      - 如果上下文不够，明确指出还需要哪些信息
      - 使用 GitHub Flavored Markdown 输出表格、列表和代码块，确保前端可直接渲染
      - 表格必须包含表头行、分隔行和数据行，且每一行列数必须完全一致
      - 如果表格首列是序号，表头必须显式写“序号”，不要省略空表头
      - 禁止输出单独一行的竖线“|”，禁止输出半截表格或列数不一致的表格
      - 不确定是否能组成合法表格时，优先使用普通项目符号列表
      - **强制输出格式与语言约束：在你调用工具、分析证据以及进行任何中间思考时，必须将所有的思考过程（且必须全程使用中文，禁止英文或中英文混杂）严格包裹在 <think> 和 </think> 标签内。只有在输出最终报告时，才允许在标签外部进行输出。**

