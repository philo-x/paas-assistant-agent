apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: paas-ai
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 6;
        gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;
        gzip_vary on;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/diagnosis/ {
            proxy_pass http://diagnosis-sub-agent-svc.paas-ai.svc.cluster.local:10006/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/analyze/ {
            proxy_pass http://analyze-sub-agent-svc.paas-ai.svc.cluster.local:10007/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: paas-ai
  labels:
    app: paas-assistant-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paas-assistant-frontend
  template:
    metadata:
      labels:
        app: paas-assistant-frontend
    spec:
      containers:
        - name: frontend
          image: <YOUR_REGISTRY_URL>/paas-assistant-frontend:latest # 替换为您实际推送到镜像仓库的地址
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: frontend-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: paas-ai
spec:
  selector:
    app: paas-assistant-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
